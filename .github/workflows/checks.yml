name: checks

on:
  push:
  pull_request:

jobs:
  docs:
    name: Links, anchors and Sources sections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_docs.py
      - run: python3 tools/signing_vectors.py verify
      - run: python3 guides/minimal-actor/selftest.py
      - run: python3 -c "import glob,json;[json.load(open(f)) for f in glob.glob('testing/fixtures/**/*.json',recursive=True)]"

  site:
    name: Build the zensical site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pip install zensical
      # --strict turns a broken link or anchor into a build failure.
      - run: zensical build --strict --clean
